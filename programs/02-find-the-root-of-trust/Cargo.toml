[package]
name = "oracle_vault"
version = "0.1.0"
description = "A vault that pays out on an oracle's signature, with every check depending on the caller"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "oracle_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
