[package]
name = "position_value"
version = "0.1.0"
description = "A lending position valued at its worst"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "position_value"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
pyth-solana-receiver-sdk = "=1.0.1"
