[package]
name = "operator_free"
version = "0.1.0"
description = "A rewards program that lives only while the team's bot and admin do"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "operator_free"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
