[package]
name = "round_exit"
version = "0.1.0"
description = "A round-based game with three dependencies and their exits"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "round_exit"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
