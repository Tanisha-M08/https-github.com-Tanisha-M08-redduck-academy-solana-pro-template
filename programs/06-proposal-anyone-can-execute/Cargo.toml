[package]
name = "open_multisig"
version = "0.1.0"
description = "A multisig whose stored proposals only the admin can execute"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "open_multisig"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
